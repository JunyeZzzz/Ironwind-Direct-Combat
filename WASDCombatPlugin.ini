; ==============================================================
;  铁风执刃：模组设置
;
;  建议在游戏“选项 > 铁风执刃”中调整。下方英文节名和键名
;  是程序读取用的标识，不能翻译。直接修改本文件的第一人称
;  参数后，重新进入第一人称使其生效。
; ==============================================================

[Keybinds]
ToggleDC         = V
MoveForward      = W
MoveBackward     = S
MoveLeft         = A
MoveRight        = D
SelectControl    = G
FirstPerson      = F
; 第一人称和越肩视角中，Shift＋此键切换潜行。
SneakToggle      = C
; 将越肩镜头切换到另一侧。
SwapShoulder     = H
; 方向战斗开启时，靠近并面向目标会自动显示交互提示，按此键
; 打开该目标的原版交互菜单。关闭方向战斗时为键盘攻击。
Attack           = E
Block            = Q
; 键位布局版本，请勿修改。
KeyLayout        = 3

[Settings]
; 背包打开时镜头转向角色。关闭后，搜刮或交易时可继续 WASD 移动。
; V 手动模式有单独的背包控制规则。
InventoryFaceCam = true
; WASD 移动速度不超过角色的真实最高速度。
WasdSpeedCap     = true
WasdSpeedMult    = 1.0
; 敌人可追击并攻击正在 WASD 移动的角色。
EnemyPursuit     = true

; --- 手动战斗 ---
; 是否开启由玩家控制的攻击和格挡。
ManualBlock      = true
; 按住左键并移动鼠标选择方向，松开左键攻击；右键取消待发
; 攻击并按当前方向格挡。攻击或收招期间可缓存下一击。
; Shift＋W/A/S/D 保持为普通移动。关闭后使用 E/Q。
DirectionalCombat = true
; 格挡模式开关。false：按住右键，按鼠标方向手动格挡；
; true：仍需按住右键请求格挡，由 Kenshi 原版 AI 选择方向；松开即停止。
AiBlocksInManual = false
; 高级兼容项：关闭方向战斗后，键盘格挡的持续时间和冷却时间（毫秒）。
BlockHoldMs            = 900
BlockCooldownMs        = 500
; 攻击输入保留时间。
AttackWindowMs         = 400
; 攻击结束后到下次输入之间的间隔；忽略过快的重复按键。
AttackRecoveryMs       = 300
InputRepeatGuardMs     = 180
; 准星选取夹角（第一人称／越肩）与鼠标选取半径（普通镜头）。
AimConeDeg             = 35
AimHoverPx             = 70
; 画面提示：目标名称和状态条。
AimNameTag             = true

; --- V 模式越肩镜头：滚轮可拉远至 120，拉近可进入第一人称 ---
OtsDistance      = 23
OtsHeight        = 18.0
OtsSide          = 3.0
; 墙壁把镜头推近时使用的近裁剪距离。
OtsNearClip      = 0.15

; --- 故障排查 ---
; 将战斗和移动事件写入 RE_Kenshi_log.txt。
VerboseLog       = true

[FirstPerson]
; 鼠标视角灵敏度（0.1—5）。
Sensitivity      = 1.0
; 视点沿视线方向的前移量；0 比旧默认值后退 1 游戏单位。
ForwardOffset    = 0.0
; 第一人称视野角度（50°—110°）；越肩视野不受影响。
FOV              = 90
; 近裁剪距离：调低可看到更多自身身体，但转头时远处草地
; 可能闪烁；1.0 是折中值。
NearClip         = 1.0
; 倒地或布娃娃状态时使用的近裁剪距离。
DownNearClip     = 0.05
; 双面绘制自身身体，避免从内部看到空壳。
BodySolidInside  = 1
; 第一人称隐藏自己的头部、帽子、胡须和头发。
HeadPixelHide    = 1
; 旧式隐藏头部方式：缩小头骨。模组种族使用普通隐藏方式
; 出现异常时，可开启此项并关闭 HeadPixelHide。
HideHead         = 0
HideHeadgear     = 1
HideHair         = 1
; 隐藏受伤时捂头、捂伤口的遮挡动作。
HideInjuryOverlay = 1
; 在多层建筑内显示角色下方的楼层。
FloorRevealBelow = 1


[NativeBinds]
version=2
dc_toggle=47
